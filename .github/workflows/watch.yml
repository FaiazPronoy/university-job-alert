name: University circular watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: watch
        options:
          - watch
          - test-message

permissions:
  contents: write

concurrency:
  group: university-circular-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RUN_MODE" = "test-message" ]; then
            python watcher.py --test-message
          else
            python watcher.py
          fi

      - name: Save bot memory
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ -f state/state.json ]; then
            git add state/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update watcher state"
              git pull --rebase
              git push
            fi
          fi
